<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Valuta Casa — Roma</title>
<link rel="stylesheet" href="/css/style.css">
</head><body>
<div class="mesh"><i></i><i></i><i></i></div>
<div class="wrap">

<div class="head"><div class="logo">🏠</div><div><h1>Valuta Casa</h1></div></div>
<p class="sub">Buon affare o no? Confronto coi valori OMI ufficiali di Roma (2025).</p>

<div id="form">
<div class="card">
  <div class="field">
    <label>Link annuncio</label>
    <input id="url" type="url" inputmode="url" placeholder="incolla link Idealista / Immobiliare…" autocomplete="off">
    <div class="hint">Provo ad aprirlo e leggere foto + planimetria. Se il portale blocca, compila i campi sotto.</div>
  </div>
  <div class="divider">oppure dati a mano</div>
  <div class="row">
    <div class="field"><label>Prezzo €</label><input id="prezzo" type="number" inputmode="numeric" placeholder="380000"></div>
    <div class="field"><label>m²</label><input id="mq" type="number" inputmode="numeric" placeholder="95"></div>
  </div>
  <div class="field"><label>Zona</label><input id="zona" list="zonelist" placeholder="es. Monteverde Nuovo" autocomplete="off"><datalist id="zonelist"></datalist></div>
  <div class="field"><label>Note (facoltativo)</label><input id="note" placeholder="villa? seminterrato? agenzia? affittato?"></div>
  <div class="pwbox field" id="pwbox"><label>Password</label><input id="pw" type="password" placeholder="password" autocomplete="current-password"></div>
  <button class="go" id="go">Valuta</button>
</div>
</div>

<div id="result">
  <div id="verdict"></div>
  <div id="md" class="md"></div>
  <button class="again" id="again">↺ Valuta un altro</button>
</div>

<div class="foot">Dati OMI Agenzia Entrate II sem. 2025 · stima indicativa, non perizia</div>
</div>

<script type="module" src="/js/app.js"></script>
</body></html>
