<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valuta Casa — Roma vs OMI</title>
<style>
  :root{--bg:#0f1115;--card:#1a1e26;--line:#2a2f3a;--txt:#e6e9ef;--mut:#8b93a3;--accent:#4aa3ff;--good:#2ecc71;--bad:#e74c3c;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--mut);font-size:13px;margin-bottom:18px;}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;}
  input,textarea{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;}
  textarea{min-height:60px;resize:vertical;}
  .row{display:flex;gap:10px;}
  .row>div{flex:1;}
  button{margin-top:16px;width:100%;background:var(--accent);color:#06121f;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;}
  button:disabled{opacity:.5;}
  .hint{color:var(--mut);font-size:12px;margin-top:6px;}
  .out{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.55;display:none;}
  .out.show{display:block;}
  .err{border-color:var(--bad);color:#ffd6d0;}
  .meta{font-size:12px;color:var(--mut);margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
  details{margin-top:10px;} summary{cursor:pointer;color:var(--mut);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏠 Valuta Casa — Roma</h1>
  <div class="sub">Incolla un link Idealista (o i dati a mano). Opinione di Claude vs valori OMI ufficiali 2025-S2.</div>

  <label>Password</label>
  <input id="pw" type="password" placeholder="password condivisa" autocomplete="current-password">

  <label>Link annuncio Idealista</label>
  <input id="url" type="url" placeholder="https://www.idealista.it/immobile/…" autocomplete="off">
  <div class="hint">Se il link non si apre (Idealista blocca), compila i campi qui sotto.</div>

  <details>
    <summary>Dati a mano (se il link non basta)</summary>
    <div class="row">
      <div><label>Prezzo €</label><input id="prezzo" type="number" inputmode="numeric" placeholder="380000"></div>
      <div><label>Superficie mq</label><input id="mq" type="number" inputmode="numeric" placeholder="150"></div>
    </div>
    <label>Indirizzo</label>
    <input id="indirizzo" type="text" placeholder="Via dei Savorelli 114">
    <label>Note (villa? seminterrato? agenzia? affittato?)</label>
    <textarea id="note" placeholder="es. casa indipendente con giardino / piano seminterrato / agenzia"></textarea>
  </details>

  <button id="go">Valuta</button>

  <div id="out" class="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// password ricordata
const savedPw = localStorage.getItem("vc_pw");
if (savedPw) $("pw").value = savedPw;

// dati dal bookmarklet via ?d=<base64 json>
(function fromBookmarklet(){
  const p = new URLSearchParams(location.search).get("d");
  if (!p) return;
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(p))));
    if (d.url) $("url").value = d.url;
    if (d.price) $("prezzo").value = d.price;
    if (d.mq) $("mq").value = d.mq;
    if (d.indirizzo) $("indirizzo").value = (d.indirizzo + (d.zona?(", "+d.zona):""));
    if (d.note || d.agenzia) $("note").value = [d.note, d.agenzia?"agenzia":""].filter(Boolean).join("; ");
    // auto-valuta se ho password salvata + dati minimi
    if (savedPw && d.price && d.mq) setTimeout(()=>$("go").click(), 300);
  } catch(e) {}
})();

$("go").addEventListener("click", async () => {
  localStorage.setItem("vc_pw", $("pw").value);
  const body = {
    password: $("pw").value,
    url: $("url").value.trim() || undefined,
    prezzo: $("prezzo").value ? Number($("prezzo").value) : undefined,
    mq: $("mq").value ? Number($("mq").value) : undefined,
    indirizzo: $("indirizzo").value.trim() || undefined,
    note: $("note").value.trim() || undefined,
  };
  if (!body.password) { show("Inserisci la password.", true); return; }
  if (!body.url && (!body.prezzo || !body.mq)) { show("Inserisci un link, oppure prezzo + mq.", true); return; }

  $("go").disabled = true; $("go").textContent = "Valuto…";
  try {
    const r = await fetch("/api/valuta", {
      method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) { show(j.error || "Errore", true); }
    else {
      const meta = j.dati
        ? `dati usati: ${j.dati.indirizzo||"?"} · ${j.dati.prezzo?j.dati.prezzo+"€":"?"} · ${j.dati.mq?j.dati.mq+"mq":"?"}`
        : "";
      show(j.opinione, false, meta);
    }
  } catch (e) { show("Errore di rete: " + e.message, true); }
  $("go").disabled = false; $("go").textContent = "Valuta";
});
// Costruzione DOM senza innerHTML su dati non fidati (no XSS).
function show(txt, isErr, meta){
  const o = $("out");
  o.className = "out show" + (isErr ? " err" : "");
  o.textContent = "";                       // reset
  const body = document.createElement("div");
  body.textContent = txt;                    // opinione: solo testo
  o.appendChild(body);
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;                     // meta: solo testo
    o.appendChild(m);
  }
}
</script>
</body>
</html>
