<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Valuta Casa — Roma</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--line:#2a2f3a;--txt:#e6e9ef;--mut:#8b93a3;--accent:#4aa3ff;--good:#2ecc71;--bad:#e74c3c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom);}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 50px;}
h1{font-size:22px;margin:0 0 2px;} .sub{color:var(--mut);font-size:13px;margin-bottom:20px;}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 5px;font-weight:600;}
input{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;}
input:focus{outline:none;border-color:var(--accent);}
.row{display:flex;gap:10px;} .row>div{flex:1;}
button{margin-top:20px;width:100%;background:var(--accent);color:#06121f;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;}
button:disabled{opacity:.5;}
.hint{color:var(--mut);font-size:12px;margin-top:5px;}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:18px 0 4px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
.out{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;white-space:pre-wrap;line-height:1.6;display:none;}
.out.show{display:block;} .out.err{border-color:var(--bad);}
.meta{font-size:12px;color:var(--mut);border-top:1px solid var(--line);margin-top:12px;padding-top:10px;}
.pwbox{display:none;}
</style></head><body><div class="wrap">
<h1>🏠 Valuta Casa</h1>
<div class="sub">Buon affare o no? Confronto coi valori OMI ufficiali di Roma (2025).</div>

<label>Link annuncio (Idealista, Immobiliare…)</label>
<input id="url" type="url" inputmode="url" placeholder="incolla qui il link" autocomplete="off">
<div class="hint">Provo ad aprirlo. Se il portale blocca, compila i 3 campi sotto.</div>

<div class="divider">dati dell'annuncio</div>
<div class="row">
<div><label>Prezzo €</label><input id="prezzo" type="number" inputmode="numeric" placeholder="380000"></div>
<div><label>Superficie m²</label><input id="mq" type="number" inputmode="numeric" placeholder="95"></div>
</div>
<label>Zona / quartiere</label>
<input id="zona" list="zonelist" placeholder="es. Monteverde Nuovo" autocomplete="off">
<datalist id="zonelist"></datalist>
<label>Note <span class="hint">(facoltativo: villa? seminterrato? agenzia? affittato?)</span></label>
<input id="note" placeholder="es. privato, ristrutturato">

<div class="pwbox" id="pwbox">
<label>Password</label>
<input id="pw" type="password" placeholder="password" autocomplete="current-password">
</div>

<button id="go">Valuta</button>
<div id="out" class="out"></div>
</div>

<script>
var $=function(i){return document.getElementById(i);};
var ZONES=["Acilia Nord","Acilia Nuova","Acilia Sud","Acqua Vergine","Agro Romano Ovest","Alessandrino","Anagnina Valle Marciana","Appia Antica","Appio Claudio","Appio Latino","Appio Metronio","Appio Nocera Umbra","Appio Villa Fiorelli","Arco Di Travertino","Ardeatina Selvotta","Ardeatino Millevoi","Ardeatino Ottavo Colle","Aurelio Gregorio Vii","Aurelio Madonna Del Riposo","Aurelio Monte Di Creta","Aurelio Val Cannuta","Aventino","Balduina Belsito","Balduina Giovenale","Batteria Nomentana","Bel Poggio","Boccea Quartaccio","Bologna","Borghesiana","Borgo","Bosco Degli Arvali","Bravetta","Bufalotta","Camilluccia","Campitelli","Capannelle","Casaccia","Casal Bertone","Casal Boccone Bufalotta","Casal Bruciato","Casal Dei Pazzi","Casal Lumbroso","Casal Monastero","Casal Morena","Casal Palocco","Casalotti","Casalotti  Pantan Monastero","Casalotti Selva Candida","Casalotti Valle Santa","Casetta Mattei","Casilino Due Torri","Casilino Marranella","Casilino Villa De Santis","Cassia Due Ponti","Castel Di Decima","Castel Di Guido","Castel Di Leva","Castel Giubileo","Castel Romano","Castelverde","Castro Pretorio","Cavalleggeri","Cecchignola","Celio","Centocelle","Cesano","Cinecitta` Don Bosco","Cinecitta` Est","Cinecitta` Lamaro","Cipro","Citta` D`Europa","Collatino","Colle Mattia","Colle Salario","Colli Aniene","Colli Portuensi","Collina Fleming","Conca D`Oro","Corcolle","Corso Vittorio","Cortina D`Ampezzo","Decima","Della Vittoria","Divino Amore","Dragona","Dragoncello","Due Leoni","Esquilino","Falcognana","Farnesina","Ferratella","Fidene","Fiera Di Roma","Finocchio","Fioranello","Flaminio","Flaminio Porta Del Popolo","Fontana Candida","Fonte Laurentina","Fonte Meravigliosa","Fonte Ostiense","Fosso San Giuliano","Fosso Sant`Andrea","Garbatella","Giardinetti","Giuliano Dalmata","Gregna Sant`Andrea","Grotta Perfetta","Grottarossa","Infernetto","Isola Farnese","La Cinquina","La Giustiniana","La Rustica","La Storta","La Storta Casale San Nicola","Labaro","Lago Regillo","Lanciani","Longarina","Lucrezia Romana","Ludovisi","Lunghezza","Madonnetta","Magliana","Malagrotta","Malborghetto","Marco Polo","Marconi","Massimina","Mezzocammino","Montagnola","Monte Del Marmo","Monte Mario Alto","Monte Pietra Pertusa","Montesacro","Montespaccato","Monteverde Nuovo","Monteverde Vecchio","Monti","Morena","Morena Gasperina","Mostacciano","Muratella","Nocetta","Nomentano Kant","Nomentano Torlonia","Nuovo Salario","Olgiata","Osteria Del Curato","Osteria Nuova","Ostia Antica","Ostia Levante","Ostia Ponente","Ostiense","Ottavia Lucchina","Ottavia Palmarola","Parco Di Veio Prato Della Corte","Parioli","Passo Lombardo","Pian Savelli","Piana Del Sole","Pietralata","Pietralata Tiburtino","Pigneto","Pinciano","Pineta Sacchetti","Pisana","Podere Rosa","Ponte Di Nona","Ponte Galeria","Ponte Mammolo","Ponte Milvio","Porta Di Roma","Porta Portese","Portonaccio","Portuense","Prati","Prati Fiscali","Prenestino Colle Del Sole","Prenestino Labicano","Prima Porta","Primavalle","Quadraro","Quarto Miglio","Riserva Della Marcigliana","Roma 70","Romanina","Romanina Tor Vergata","Sacco Pastore","Salario","Salario Africano","Salario Trieste","Sallustiano","San Basilio","San Lorenzo","San Paolo","San Saba","San Vittorino","Sant`Angelo","Santa Cornelia","Santa Maria Di Galeria","Santa Palomba","Saxa Rubra","Serpentara","Settebagni","Settecamini","Settecamini Case Rosse","Spinaceto","Spregamore","Stagni Di Ostia","Statuario","Talenti","Testaccio","Tiberina","Tintoretto","Tomba Di Nerone","Tor Bella Monaca","Tor Bella Monaca Peep","Tor Cervara","Tor De` Cenci","Tor Fiscale","Tor Marancia Navigatori","Tor Pagnotta","Tor Pignattara","Tor Sapienza","Tor Tre Teste","Tor Vergata Universita`","Torraccia Di San Basilio","Torre Angela","Torre Gaia","Torre Maura","Torre Spaccata","Torrenova","Torresina","Torrevecchia","Torrino Nord","Torrino Sud","Tragliatella","Trastevere","Tridente","Trigoria","Trionfale Igea","Trullo","Tufello","Valle Fiorita","Valle Muricana","Vallerano","Valmelaina","Verderocca","Vermicino","Vigna Clara","Vigne Nuove","Villa Spada","Villaggio Breda","Villaggio Olimpico","Villaverde","Viminale","Vitinia"];
var dl=$("zonelist"); ZONES.forEach(function(z){var o=document.createElement("option");o.value=z;dl.appendChild(o);});

// password salvata
var pw=localStorage.getItem("vc_pw");
if(!pw) $("pwbox").style.display="block";

// dati dal vecchio bookmarklet/shortcut via ?d=
(function(){
  var p=new URLSearchParams(location.search).get("d"); if(!p) return;
  try{
    var d=JSON.parse(decodeURIComponent(escape(atob(p))));
    if(d.url)$("url").value=d.url;
    if(d.price)$("prezzo").value=d.price;
    if(d.mq)$("mq").value=d.mq;
    if(d.zona)$("zona").value=d.zona;
    else if(d.indirizzo)$("zona").value=d.indirizzo;
    if(d.note||d.agenzia)$("note").value=[d.note,d.agenzia?"agenzia":""].filter(Boolean).join("; ");
    if(pw && d.price && d.mq) setTimeout(function(){$("go").click();},300);
  }catch(e){}
})();

$("go").addEventListener("click",function(){
  var password=pw||$("pw").value;
  if(!password){$("pwbox").style.display="block";show("Inserisci la password (prima volta).",true);return;}
  localStorage.setItem("vc_pw",password); pw=password;
  var body={password:password,url:$("url").value.trim()||undefined,
    prezzo:$("prezzo").value?Number($("prezzo").value):undefined,
    mq:$("mq").value?Number($("mq").value):undefined,
    indirizzo:$("zona").value.trim()||undefined,
    note:$("note").value.trim()||undefined};
  if(!body.url && (!body.prezzo||!body.mq||!body.indirizzo)){
    show("Incolla un link, oppure compila prezzo + m² + zona.",true);return;
  }
  $("go").disabled=true;$("go").textContent="Valuto…";
  fetch("/api/valuta",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     if(!res.ok){show(res.j.error||"Errore",true);}
     else{var m=res.j.dati?("dati: "+(res.j.dati.indirizzo||"?")+" · "+(res.j.dati.prezzo||"?")+"€ · "+(res.j.dati.mq||"?")+"m²"):"";show(res.j.opinione,false,m);}
   })
   .catch(function(e){show("Errore di rete: "+e.message,true);})
   .then(function(){$("go").disabled=false;$("go").textContent="Valuta";});
});

function show(txt,isErr,meta){
  var o=$("out");o.className="out show"+(isErr?" err":"");o.textContent="";
  var b=document.createElement("div");b.textContent=txt;o.appendChild(b);
  if(meta){var m=document.createElement("div");m.className="meta";m.textContent=meta;o.appendChild(m);}
  o.scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script></body></html>
