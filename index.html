<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Valuta Casa — Roma</title>
<style>
:root{
  --bg:#07080d;--card:rgba(22,26,38,.55);--cardb:rgba(255,255,255,.08);
  --txt:#eef1f7;--mut:#9aa3b8;--faint:#5b6378;
  --accent:#5b9dff;--accent2:#9d6bff;
  --good:#2fe0a4;--mid:#ffcf5c;--bad:#ff5d6c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{
  background:var(--bg);color:var(--txt);
  font:16px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;position:relative;overflow-x:hidden;
}
/* sfondo mesh animato (blob gradient sfocati) */
.mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(70px);opacity:.6;}
.mesh i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:float 18s ease-in-out infinite;}
.mesh i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-6vh;background:#5b9dff;animation-delay:0s;}
.mesh i:nth-child(2){width:42vw;height:42vw;right:-10vw;top:8vh;background:#9d6bff;animation-delay:-6s;}
.mesh i:nth-child(3){width:38vw;height:38vw;left:18vw;bottom:-14vh;background:#2fe0a4;opacity:.7;animation-delay:-11s;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(6vw,4vh) scale(1.1);}66%{transform:translate(-4vw,-3vh) scale(.95);}}
@media(prefers-reduced-motion:reduce){.mesh i{animation:none;}}

.wrap{max-width:600px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px 60px;}
.head{display:flex;align-items:center;gap:13px;margin-bottom:6px;}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(124,91,255,.45);}
h1{font-size:22px;margin:0;font-weight:850;letter-spacing:-.4px;}
.sub{color:var(--mut);font-size:13px;margin:0 0 22px;}

/* glass card */
.card{
  background:var(--card);border:1px solid var(--cardb);border-radius:20px;padding:18px;margin-bottom:14px;
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.field{margin-bottom:14px;}
input{width:100%;background:rgba(7,8,13,.5);color:var(--txt);border:1px solid var(--cardb);border-radius:12px;padding:14px;font-size:16px;transition:border .15s,box-shadow .15s;}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.2);}
input::placeholder{color:var(--faint);}
.row{display:flex;gap:10px;} .row>.field{flex:1;}
.hint{color:var(--mut);font-size:12px;margin-top:6px;}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 16px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--cardb);}
button.go{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:14px;padding:17px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 26px rgba(91,157,255,.4);transition:transform .1s,opacity .15s,box-shadow .15s;}
button.go:hover{box-shadow:0 10px 34px rgba(124,91,255,.5);}
button.go:active{transform:scale(.98);} button.go:disabled{opacity:.55;box-shadow:none;}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* risultato */
#result{display:none;}
#result.show{display:block;animation:fade .35s cubic-bezier(.2,.8,.2,1);}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.verdict{position:relative;overflow:hidden;border-radius:20px;margin-bottom:14px;border:1px solid var(--cardb);padding:18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.4);}
.verdict.good{background:linear-gradient(135deg,rgba(47,224,164,.2),rgba(47,224,164,.04));border-color:rgba(47,224,164,.45);}
.verdict.mid{background:linear-gradient(135deg,rgba(255,207,92,.2),rgba(255,207,92,.04));border-color:rgba(255,207,92,.45);}
.verdict.bad{background:linear-gradient(135deg,rgba(255,93,108,.2),rgba(255,93,108,.04));border-color:rgba(255,93,108,.45);}
.vtop{display:flex;align-items:center;gap:14px;}
.vbig{font-size:34px;font-weight:900;line-height:1;letter-spacing:-1px;}
.vbig.good{color:var(--good);} .vbig.mid{color:var(--mid);} .vbig.bad{color:var(--bad);}
.vlabel{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.vsub{font-size:15px;color:var(--txt);font-weight:600;}
.vmeta{font-size:12px;color:var(--mut);margin-top:3px;}

/* barra range OMI */
.gauge{margin-top:16px;}
.gauge-track{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,rgba(47,224,164,.5),rgba(255,207,92,.5) 55%,rgba(255,93,108,.5));overflow:visible;}
.gauge-med{position:absolute;top:-3px;width:2px;height:16px;background:rgba(255,255,255,.5);border-radius:2px;}
.gauge-dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.6);transition:left .6s cubic-bezier(.2,.8,.2,1);}
.gauge-lbls{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--mut);}
.gauge-lbls b{color:var(--txt);}
.gauge-cur{text-align:center;margin-top:6px;font-size:13px;color:var(--txt);font-weight:700;}

.md{background:var(--card);border:1px solid var(--cardb);border-radius:18px;padding:6px 18px 18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.4);}
.md h1,.md h2,.md h3{font-size:15px;margin:18px 0 8px;color:var(--accent);font-weight:800;letter-spacing:.2px;}
.md p{margin:8px 0;} .md strong{color:#fff;}
.md ul{margin:8px 0;padding-left:20px;} .md li{margin:4px 0;}
.md table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;}
.md th,.md td{border:1px solid var(--cardb);padding:8px 10px;text-align:left;}
.md th{background:rgba(7,8,13,.5);color:var(--mut);font-weight:700;}
.md hr{border:0;border-top:1px solid var(--cardb);margin:14px 0;}
.md code{background:rgba(7,8,13,.6);padding:1px 6px;border-radius:6px;font-size:13px;}
.errbox{background:rgba(255,93,108,.14);border:1px solid rgba(255,93,108,.45);border-radius:14px;padding:14px;color:#ffd0d5;}
.again{margin-top:14px;background:var(--card);color:var(--txt);border:1px solid var(--cardb);border-radius:12px;padding:13px;width:100%;font-size:15px;font-weight:700;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.pwbox{display:none;}
.foot{text-align:center;color:var(--faint);font-size:11px;margin-top:24px;}
</style></head><body>

Longarina","Lucrezia Romana","Ludovisi","Lunghezza","Madonnetta","Magliana","Malagrotta","Malborghetto","Marco Polo","Marconi","Massimina","Mezzocammino","Montagnola","Monte Del Marmo","Monte Mario Alto","Monte Pietra Pertusa","Montesacro","Montespaccato","Monteverde Nuovo","Monteverde Vecchio","Monti","Morena","Morena Gasperina","Mostacciano","Muratella","Nocetta","Nomentano Kant","Nomentano Torlonia","Nuovo Salario","Olgiata","Osteria Del Curato","Osteria Nuova","Ostia Antica","Ostia Levante","Ostia Ponente","Ostiense","Ottavia Lucchina","Ottavia Palmarola","Parco Di Veio Prato Della Corte","Parioli","Passo Lombardo","Pian Savelli","Piana Del Sole","Pietralata","Pietralata Tiburtino","Pigneto","Pinciano","Pineta Sacchetti","Pisana","Podere Rosa","Ponte Di Nona","Ponte Galeria","Ponte Mammolo","Ponte Milvio","Porta Di Roma","Porta Portese","Portonaccio","Portuense","Prati","Prati Fiscali","Prenestino Colle Del Sole","Prenestino Labicano","Prima Porta","Primavalle","Quadraro","Quarto Miglio","Riserva Della Marcigliana","Roma 70","Romanina","Romanina Tor Vergata","Sacco Pastore","Salario","Salario Africano","Salario Trieste","Sallustiano","San Basilio","San Lorenzo","San Paolo","San Saba","San Vittorino","Sant`Angelo","Santa Cornelia","Santa Maria Di Galeria","Santa Palomba","Saxa Rubra","Serpentara","Settebagni","Settecamini","Settecamini Case Rosse","Spinaceto","Spregamore","Stagni Di Ostia","Statuario","Talenti","Testaccio","Tiberina","Tintoretto","Tomba Di Nerone","Tor Bella Monaca","Tor Bella Monaca Peep","Tor Cervara","Tor De` Cenci","Tor Fiscale","Tor Marancia Navigatori","Tor Pagnotta","Tor Pignattara","Tor Sapienza","Tor Tre Teste","Tor Vergata Universita`","Torraccia Di San Basilio","Torre Angela","Torre Gaia","Torre Maura","Torre Spaccata","Torrenova","Torresina","Torrevecchia","Torrino Nord","Torrino Sud","Tragliatella","Trastevere","Tridente","Trigoria","Trionfale Igea","Trullo","Tufello","Valle Fiorita","Valle Muricana","Vallerano","Valmelaina","Verderocca","Vermicino","Vigna Clara","Vigne Nuove","Villa Spada","Villaggio Breda","Villaggio Olimpico","Villaverde","Viminale","Vitinia"];

var EXT=null; // dati extra da estensione (foto+planimetrie, descrizione) non in form
(function(){var p=new URLSearchParams(location.search).get("d");if(!p)return;try{var d=JSON.parse(decodeURIComponent(escape(atob(p))));EXT=d;if(d.url)$("url").value=d.url;if(d.price)$("prezzo").value=d.price;if(d.mq)$("mq").value=d.mq;if(d.zona)$("zona").value=d.zona;else if(d.indirizzo)$("zona").value=d.indirizzo;if(d.note||d.agenzia)$("note").value=[d.note,d.agenzia?"agenzia":""].filter(Boolean).join("; ");if(pw&&d.price&&d.mq)setTimeout(function(){$("go").click();},300);}catch(e){}})();

  var password=pw||$("pw").value;
  if(!password){$("pwbox").style.display="block";return;}

  if(EXT){ if(EXT.foto&&EXT.foto.length)body.foto=EXT.foto; if(EXT.descrizione)body.descrizione=EXT.descrizione; }

// mini markdown -> HTML (l'opinione viene da Claude via ns backend; comunque escape su < & >)
function md2html(s){
  function esc(t){return t.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  var lines=esc(s).split("\n"),out=[],i=0,inTbl=false,inUl=false;
  function closeUl(){if(inUl){out.push("</ul>");inUl=false;}}
  function closeTbl(){if(inTbl){out.push("</tbody></table>");inTbl=false;}}
  while(i<lines.length){
    var l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l)){
      var cells=l.trim().replace(/^\||\|$/g,"").split("|");
      if(/^[\s:|-]+$/.test(l.replace(/\|/g,""))){i++;continue;}
      if(!inTbl){out.push('<table><tbody>');inTbl=true;}
      out.push("<tr>"+cells.map(function(c){return "<td>"+inline(c.trim())+"</td>";}).join("")+"</tr>");
      i++;continue;
    } else closeTbl();
    var h=l.match(/^(#{1,3})\s+(.*)/);
    if(h){closeUl();out.push("<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">");i++;continue;}
    if(/^\s*[-*]\s+/.test(l)){if(!inUl){out.push("<ul>");inUl=true;}out.push("<li>"+inline(l.replace(/^\s*[-*]\s+/,""))+"</li>");i++;continue;}
    closeUl();
    if(/^\s*---+\s*$/.test(l)){out.push("<hr>");i++;continue;}
    if(l.trim()==="")out.push("");else out.push("<p>"+inline(l)+"</p>");
    i++;
  }
  closeUl();closeTbl();
  return out.join("");
  function inline(t){return t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`(.+?)`/g,"<code>$1</code>");}
}

// badge verdetto dai campi STRUTTURATI del backend (sconto/esito calcolati, non pescati dal testo)
function buildVerdict(op,dati){
  var pct = (dati && typeof dati.sconto==="number") ? dati.sconto : null;
  var esito = (dati && dati.esito) ? dati.esito : null;
  var tone="mid",big="—",label="Valutazione",sub="Da valutare";
  if(pct!==null){
    big=(pct>0?"+":"")+pct+"%";
    if(pct>=8){tone="good";label="Sotto mercato";sub="Possibile affare";}
    else if(pct>=-3){tone="mid";label="In linea";sub="In linea col mercato";}
    else{tone="bad";label="Sopra mercato";sub="Probabilmente caro";}
  } else if(esito){
    if(esito==="AFFARE"){tone="good";big="Sì";label="Affare";sub="Sotto mercato";}
    else if(esito==="CARO"){tone="bad";big="No";label="Caro";sub="Sopra mercato";}
    else{tone="mid";big="≈";label="In linea";}
  }
  return {tone:tone,big:big,label:label,sub:sub};
}

// TODO(Marco): calcola la posizione del pallino (0..100 %) del €/mq annuncio nella barra range OMI.
// Input: eurMq (€/mq annuncio), omi = {min, med, max} (€/mq OMI zona).
// Deve restituire un numero 0..100 (% da sinistra). Considera il caso fuori range (eurMq<min o >max).
// Vedi le 3 strategie discusse: clamp / overflow / scala estesa ±20%. Scegli tu.
function barPos(eurMq, omi){
  var sp=omi.max-omi.min || 1;
  var base=omi.min-0.2*sp, top=omi.max+0.2*sp; // scala estesa ±20%: fuori-range resta visibile
  return (eurMq-base)/(top-base)*100;
}

function showResult(opinione,err,dati){
  $("form").style.display="none";
  var r=$("result");r.className="show";
  var v=$("verdict"),md=$("md");
  if(err){v.innerHTML="";md.className="";md.innerHTML='<div class="errbox"></div>';md.querySelector(".errbox").textContent=err;window.scrollTo({top:0,behavior:"smooth"});return;}
  md.className="md";
  var vd=buildVerdict(opinione,dati);
  v.className="verdict "+vd.tone;

  // meta riga: foto + planimetrie analizzate
  var nFoto=(dati&&dati.nFoto)||0, nPlan=(dati&&dati.nPlan)||0;
  var bits=[];
  if(nPlan)bits.push("🗺️ "+nPlan+" planimetri"+(nPlan>1?"e":"a"));
  if(nFoto-nPlan>0)bits.push("📷 "+(nFoto-nPlan)+" foto");
  var metaTxt=bits.length?bits.join(" · ")+" analizzate":"";

  // costruzione DOM (no innerHTML su valori dinamici)
  v.innerHTML="";
  var top=document.createElement("div");top.className="vtop";
  var big=document.createElement("div");big.className="vbig "+vd.tone;big.textContent=vd.big;
  var col=document.createElement("div");
  var lab=document.createElement("div");lab.className="vlabel";lab.textContent=vd.label;
  var sub=document.createElement("div");sub.className="vsub";sub.textContent=vd.sub;
  col.appendChild(lab);col.appendChild(sub);
  if(metaTxt){var m=document.createElement("div");m.className="vmeta";m.textContent=metaTxt;col.appendChild(m);}
  top.appendChild(big);top.appendChild(col);
  v.appendChild(top);

  // barra range OMI (solo se ho eurMq + omi)
  if(dati&&dati.eurMq&&dati.omi&&dati.omi.min){
    var pos=Math.max(0,Math.min(100,barPos(dati.eurMq,dati.omi)));
    var posMed=Math.max(0,Math.min(100,barPos(dati.omi.med,dati.omi)));
    var g=document.createElement("div");g.className="gauge";
    var track=document.createElement("div");track.className="gauge-track";
    var medM=document.createElement("div");medM.className="gauge-med";medM.style.left=posMed+"%";
    var dot=document.createElement("div");dot.className="gauge-dot";dot.style.left=pos+"%";
    track.appendChild(medM);track.appendChild(dot);
    var lbls=document.createElement("div");lbls.className="gauge-lbls";
    lbls.innerHTML="";
    var l1=document.createElement("span"),l2=document.createElement("span"),l3=document.createElement("span");
    l1.innerHTML="<b>"+fmtK(dati.omi.min)+"</b> min";
    l2.innerHTML="medio <b>"+fmtK(dati.omi.med)+"</b>";
    l3.innerHTML="max <b>"+fmtK(dati.omi.max)+"</b>";
    lbls.appendChild(l1);lbls.appendChild(l2);lbls.appendChild(l3);
    var cur=document.createElement("div");cur.className="gauge-cur";
    cur.textContent="questo annuncio: "+dati.eurMq.toLocaleString("it-IT")+" €/mq"+(dati.zona?" · zona "+dati.zona:"");
    g.appendChild(track);g.appendChild(lbls);g.appendChild(cur);
    v.appendChild(g);
  }

  md.innerHTML=md2html(opinione);
  window.scrollTo({top:0,behavior:"smooth"});
}
function fmtK(n){return n>=1000?(n/1000).toFixed(n%1000?1:0).replace(".",",")+"k":String(n);}
function escTxt(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML;}
